[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "apirecorder"
version = "0.1.0"
description = "Record what a third-party API actually does, then diff it over time."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["http", "api", "recording", "snapshot", "contract", "drift", "testing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Internet :: WWW/HTTP",
]
# No required dependencies on purpose: the recorder patches whichever HTTP
# client you already use, and everything else is standard library.
dependencies = []

[project.optional-dependencies]
requests = ["requests>=2.20"]
httpx = ["httpx>=0.23"]
all = ["requests>=2.20", "httpx>=0.23"]
dev = ["requests>=2.20", "httpx>=0.23", "pytest>=7"]

[project.scripts]
apirecorder = "apirecorder.cli:main"

[project.urls]
Homepage = "https://github.com/varun1414/api-recorder"
Source = "https://github.com/varun1414/api-recorder"
Issues = "https://github.com/varun1414/api-recorder/issues"

[tool.setuptools]
packages = ["apirecorder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
